[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harpi"
dynamic = ["version"]
description = "HARP-I: harmonic phase interpolation for motion and strain from tagged MR images"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MPL-2.0" }
# a copy of the repository licence, so the built artifacts carry the notice
license-files = { paths = ["LICENSE"] }
authors = [{ name = "Hernan Mella", email = "hernan.mella@pucv.cl" }]
keywords = ["mri", "tagging", "cardiac", "strain", "motion", "harp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "numba>=0.59",
    "h5py>=3.8",
    "pydicom>=2.4",
    "matplotlib>=3.7",
    # matplotlib pulls this in, but the filter outline imports it directly
    "contourpy>=1.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = ["pytest>=8", "pytest-cov", "ruff", "mypy"]

[project.scripts]
harpi = "harpi.cli:main"
harpi-gui = "harpi.gui.app:main"

[project.urls]
Homepage = "https://github.com/hmella/HARP-I"
Paper = "https://doi.org/10.1109/TMI.2021.3051092"

[tool.hatch.version]
path = "src/harpi/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/harpi"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
# so that a plain "pytest" works in a clone, without installing first
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY"]
